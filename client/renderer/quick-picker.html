<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>快速选择</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, sans-serif;
      background: rgba(30,30,30,0.95); border-radius: 12px; overflow: hidden; user-select: none;
    }
    .header { padding: 12px 16px; background: rgba(255,255,255,0.05); border-bottom: 1px solid rgba(255,255,255,0.1); }
    .header h2 { font-size: 13px; font-weight: 500; color: rgba(255,255,255,0.6); }
    .hint { font-size: 11px; color: rgba(255,255,255,0.4); margin-top: 4px; }
    .list { max-height: 340px; overflow-y: auto; padding: 8px; }
    .item {
      display: flex; align-items: center; padding: 10px 12px;
      border-radius: 8px; cursor: pointer; transition: background 0.15s;
    }
    .item:hover { background: rgba(255,255,255,0.1); }
    .item.running { background: rgba(52,199,89,0.15); }
    .item.running:hover { background: rgba(52,199,89,0.25); }
    .num {
      width: 24px; height: 24px; border-radius: 6px;
      background: rgba(255,255,255,0.1); color: rgba(255,255,255,0.8);
      font-size: 12px; font-weight: 600;
      display: flex; align-items: center; justify-content: center;
      margin-right: 12px; flex-shrink: 0;
    }
    .item.running .num { background: rgba(52,199,89,0.3); color: #34c759; }
    .name { flex: 1; font-size: 14px; color: rgba(255,255,255,0.9); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .status { font-size: 11px; color: rgba(255,255,255,0.4); margin-left: 8px; }
    .item.running .status { color: #34c759; }
    .empty { text-align: center; padding: 40px 20px; color: rgba(255,255,255,0.4); font-size: 14px; }
  </style>
</head>
<body>
  <div class="header">
    <h2>快速选择</h2>
    <div class="hint">按数字键或点击选择，ESC 关闭</div>
  </div>
  <div class="list" id="list"><div class="empty">加载中...</div></div>
  <script>
    let profiles = [];

    async function load() {
      profiles = (await window.electronAPI.getAllProfiles()).filter(p => p.browserMode !== 'headless');
      const el = document.getElementById('list');
      if (profiles.length === 0) { el.innerHTML = '<div class="empty">暂无配置</div>'; return; }

      el.innerHTML = profiles.map((p, i) => {
        const key = i < 9 ? i + 1 : i === 9 ? 0 : '-';
        return `
          <div class="item ${p.isRunning ? 'running' : ''}" onclick="pick(${p.id})">
            <div class="num">${key}</div>
            <div class="name">${esc(p.name)}</div>
            <div class="status">${p.isRunning ? '运行中' : ''}</div>
          </div>`;
      }).join('');
    }

    function esc(t) { const d = document.createElement('div'); d.textContent = t; return d.innerHTML; }

    async function pick(id) {
      await window.electronAPI.startOrActivate(id);
      window.close();
    }

    document.addEventListener('keydown', e => {
      if (e.key === 'Escape') { window.close(); return; }
      if (/^[0-9]$/.test(e.key)) {
        const idx = e.key === '0' ? 9 : parseInt(e.key) - 1;
        if (idx < profiles.length) pick(profiles[idx].id);
      }
    });

    load();
  </script>
</body>
</html>
