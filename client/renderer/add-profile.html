<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>添加配置</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, sans-serif;
      padding: 16px; padding-top: 40px;
      background: #f5f5f7;
      -webkit-app-region: drag;
    }
    .content { -webkit-app-region: no-drag; }
    .field { margin-bottom: 12px; }
    label { display: block; margin-bottom: 6px; font-size: 13px; font-weight: 500; color: #86868b; }
    input, select {
      width: 100%; padding: 8px 12px; font-size: 14px;
      border: 1px solid #d2d2d7; border-radius: 6px; background: #fff; outline: none;
      -webkit-appearance: none; appearance: none;
    }
    input:focus, select:focus { border-color: #0071e3; box-shadow: 0 0 0 2px rgba(0,113,227,0.2); }
    .buttons { display: flex; justify-content: flex-end; gap: 8px; margin-top: 16px; }
    button { padding: 6px 14px; font-size: 13px; border-radius: 6px; cursor: pointer; }
    .btn-primary { background: #0071e3; color: white; border: none; }
    .btn-primary:hover { background: #0077ed; }
    .btn-cancel { background: #fff; color: #1d1d1f; border: 1px solid #d2d2d7; }
    .btn-cancel:hover { background: #f0f0f0; }
  </style>
</head>
<body>
  <div class="content">
    <div class="field">
      <label for="name">名称</label>
      <input type="text" id="name" placeholder="例如：旗舰店" autofocus>
    </div>
    <div class="field">
      <label for="type">类型</label>
      <select id="type">
        <option value="wechat_shop">微信小店</option>
        <option value="miaoshou">妙手</option>
        <option value="1688">1688</option>
        <option value="dianguanjia">店管家</option>
        <option value="kuaishou_shop">快手小店</option>
        <option value="generic">通用</option>
      </select>
    </div>
    <div class="field">
      <label for="url">首页 URL</label>
      <input type="text" id="url" placeholder="https://example.com">
    </div>
    <div class="field">
      <label for="browserMode">运行模式</label>
      <select id="browserMode">
        <option value="vnc">VNC 登录</option>
        <option value="headless">Headless 采集</option>
      </select>
    </div>
    <div class="field">
      <label for="keepAlive">保活间隔（秒，0 = 不保活）</label>
      <input type="number" id="keepAlive" value="3600" min="0" step="60">
    </div>
    <div class="buttons">
      <button class="btn-cancel" onclick="window.close()">取消</button>
      <button class="btn-primary" onclick="submit()">添加</button>
    </div>
  </div>
  <script>
    // Auto-fill URL based on type
    const typeUrls = {
      wechat_shop: 'https://store.weixin.qq.com/shop/home',
      miaoshou: 'https://sphxd.chengji-inc.com/home',
      '1688': 'https://www.1688.com/',
      dianguanjia: 'https://tfxportal.dgjapp.com',
      kuaishou_shop: '',
      generic: ''
    };
    document.getElementById('type').addEventListener('change', function() {
      const urlInput = document.getElementById('url');
      if (!urlInput.value || Object.values(typeUrls).includes(urlInput.value)) {
        urlInput.value = typeUrls[this.value] || '';
      }
    });
    // Set default URL
    document.getElementById('url').value = typeUrls.wechat_shop;

    async function submit() {
      const name = document.getElementById('name').value.trim();
      const type = document.getElementById('type').value;
      const url = document.getElementById('url').value.trim();
      const keepAlive = parseInt(document.getElementById('keepAlive').value) || 0;
      const browserMode = document.getElementById('browserMode').value;
      if (!name) return document.getElementById('name').focus();
      if (!url) return document.getElementById('url').focus();
      await window.electronAPI.addProfile(name, url, type, keepAlive, browserMode);
      window.close();
    }
    document.querySelectorAll('input').forEach(el => {
      el.addEventListener('keypress', e => { if (e.key === 'Enter') submit(); });
    });
  </script>
</body>
</html>
