<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>管理配置</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, sans-serif;
      padding: 16px; padding-top: 40px;
      background: #f5f5f7;
      -webkit-app-region: drag;
    }
    .content { -webkit-app-region: no-drag; }
    h2 { font-size: 15px; font-weight: 600; color: #1d1d1f; margin-bottom: 12px; }
    .profile-list { max-height: 260px; overflow-y: auto; }
    .profile-item {
      display: flex; align-items: center; padding: 10px 12px;
      background: #fff; border-radius: 8px; margin-bottom: 8px;
      box-shadow: 0 1px 2px rgba(0,0,0,0.05);
    }
    .profile-info { flex: 1; min-width: 0; }
    .profile-name { font-size: 14px; color: #1d1d1f; }
    .profile-meta { font-size: 11px; color: #86868b; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .type-tag {
      display: inline-block; font-size: 10px; padding: 1px 6px;
      border-radius: 4px; background: #e8e8ed; color: #636366; margin-right: 4px;
    }
    .profile-info input, .profile-info select {
      width: 100%; padding: 4px 8px; font-size: 13px;
      border: 1px solid #0071e3; border-radius: 4px; outline: none; margin-bottom: 4px;
    }
    .profile-actions { display: flex; gap: 6px; }
    .btn-icon {
      width: 28px; height: 28px; border: none; border-radius: 6px; cursor: pointer;
      display: flex; align-items: center; justify-content: center;
      background: #e8e8ed; color: #86868b; font-size: 14px;
    }
    .btn-icon:hover { background: #d1d1d6; color: #1d1d1f; }
    .btn-icon.delete:hover { background: #ff3b30; color: white; }
    .btn-icon.save { background: #34c759; color: white; }
    .btn-icon.save:hover { background: #2db84d; }
    .empty { text-align: center; padding: 40px 20px; color: #86868b; font-size: 14px; }
  </style>
</head>
<body>
  <div class="content">
    <h2>管理配置</h2>
    <div class="profile-list" id="list"></div>
  </div>
  <script>
    const typeLabels = { wechat_shop: '微信小店', wechat_supplier: '微信小店供货商', miaoshou: '妙手', '1688': '1688', dianguanjia: '店管家', kuaishou_shop: '快手小店', generic: '通用' };
    let profiles = [];
    let editingId = null;

    async function load() {
      profiles = await window.electronAPI.getAllProfiles();
      render();
    }

    function esc(text) {
      const d = document.createElement('div');
      d.textContent = text;
      return d.innerHTML;
    }

    function typeOptions(selected) {
      return Object.entries(typeLabels).map(([v, l]) =>
        `<option value="${v}" ${v === selected ? 'selected' : ''}>${l}</option>`
      ).join('');
    }

    function render() {
      const el = document.getElementById('list');
      if (profiles.length === 0) { el.innerHTML = '<div class="empty">暂无配置</div>'; return; }

      el.innerHTML = profiles.map(p => {
        if (editingId === p.id) return `
          <div class="profile-item">
            <div class="profile-info">
              <input id="en-${p.id}" value="${esc(p.name)}" placeholder="名称">
              <select id="et-${p.id}">${typeOptions(p.type)}</select>
              <input id="eu-${p.id}" value="${esc(p.url||'')}" placeholder="URL">
              <input id="ek-${p.id}" type="number" value="${p.keepAliveInterval||0}" min="0" step="60" placeholder="保活间隔（秒）"
                onkeypress="if(event.key==='Enter')save(${p.id})" onkeydown="if(event.key==='Escape'){editingId=null;render()}"
                style="width:50%;display:inline-block"><span style="font-size:11px;color:#86868b;margin-left:4px">秒 (0=不保活)</span>
            </div>
            <div class="profile-actions">
              <button class="btn-icon save" onclick="save(${p.id})">&#10003;</button>
              <button class="btn-icon" onclick="editingId=null;render()">&#10005;</button>
            </div>
          </div>`;
        return `
          <div class="profile-item">
            <div class="profile-info">
              <div class="profile-name">${esc(p.name)}</div>
              <div class="profile-meta"><span class="type-tag">${typeLabels[p.type] || p.type || '通用'}</span>${p.activeBrowserMode ? `<span class="type-tag">${p.activeBrowserMode === 'headless' ? 'Headless 采集' : 'VNC 登录'}</span>` : ''}${p.keepAliveInterval ? `<span class="type-tag">保活 ${p.keepAliveInterval}s</span>` : ''}${esc(p.url||'未设置')}</div>
            </div>
            <div class="profile-actions">
              <button class="btn-icon" onclick="editingId=${p.id};render()">&#9998;</button>
              <button class="btn-icon delete" onclick="del(${p.id},'${esc(p.name)}')">&#128465;</button>
            </div>
          </div>`;
      }).join('');

      if (editingId) {
        const inp = document.getElementById(`en-${editingId}`);
        if (inp) { inp.focus(); inp.select(); }
      }
    }

    async function save(id) {
      const name = document.getElementById(`en-${id}`).value.trim();
      const type = document.getElementById(`et-${id}`).value;
      const url = document.getElementById(`eu-${id}`).value.trim();
      const keepAliveInterval = parseInt(document.getElementById(`ek-${id}`).value) || 0;
      if (!name || !url) return;
      await window.electronAPI.updateProfile(id, { name, type, url, keepAliveInterval });
      editingId = null;
      await load();
    }

    async function del(id, name) {
      if (!confirm(`确定删除「${name}」？`)) return;
      await window.electronAPI.deleteProfile(id);
      await load();
    }

    load();
  </script>
</body>
</html>
